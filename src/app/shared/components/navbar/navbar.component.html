<nav
  class="sticky top-0 z-40 bg-white shadow-lg backdrop-blur-sm bg-opacity-95"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">
      <!-- Sección 1: Logo y Botón Hamburguesa -->
      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <!-- Botón Hamburguesa (solo en móvil) -->
        <button
          (click)="toggleMenu()"
          type="button"
          class="md:hidden text-gray-700 hover:bg-gray-100 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-purple-300 transition-colors"
          aria-label="Toggle menu"
        >
          <i
            [class]="
              isMenuOpen()
                ? 'fas fa-times text-lg'
                : 'fas fa-bars text-lg'
            "
          ></i>
        </button>
        
        <!-- Logo (más pequeño en móvil) -->
        <figure class="cursor-pointer" (click)="irAlInicio()" >
          <img 
            src="./assets/img/logo-alquilaYa.svg" 
            alt="Logo de alquilaYa" 
            class="h-8"
          />
        </figure>
      </div>

      <!-- Sección 2: Buscador Central (Visible solo en desktop md y superior) -->
      <div class="hidden md:flex flex-1 mx-4 lg:mx-6 xl:mx-8 min-w-0">
        <form (ngSubmit)="performSearch()" class="w-full max-w-2xl">
          <div class="relative">
            <!-- Input de Búsqueda -->
            <input
              type="text"
              name="searchQuery"
              [(ngModel)]="searchQuery"
              placeholder="Buscar productos, categorías o ubicaciones..."
              class="w-full py-3 pl-12 pr-4 text-gray-700 placeholder-gray-400 border border-gray-200 focus:border-purple-500 focus:ring-1 focus:ring-purple-300 bg-white rounded-2xl shadow-xl text-base transition-all"
              aria-label="Campo de búsqueda"
            />
            <!-- Icono de Búsqueda -->
            <button
              type="submit"
              class="absolute left-0 top-0 mt-3 ml-4 text-gray-400 hover:text-purple-600 transition-colors"
            >
              <i class="fas fa-search"></i>
            </button>
          </div>
        </form>
      </div>

      <!-- Sección 3: Botones de Acción -->
      <div class="flex items-center space-x-2 sm:space-x-3 md:space-x-4 shrink-0">
        <!-- Botón Iniciar Sesión (solo en desktop) -->
        <a
          (click)="navigateToLogin()"
          class="hidden md:inline text-gray-700 font-semibold hover:text-purple-700 transition-colors cursor-pointer px-4 py-2 rounded-lg hover:bg-gray-50"
          aria-label="Ir a la página de inicio de sesión"
        >
          Iniciar Sesión
        </a>

        <!-- Botón Registrarse (solo en desktop) -->
        <button
          (click)="navigateToRegister()"
          class="hidden md:inline px-5 py-2.5 text-white font-bold bg-purple-700 rounded-xl shadow-lg hover:bg-purple-800 focus:outline-none focus:ring-2 focus:ring-purple-300 transition-all duration-200 cursor-pointer"
          aria-label="Registrar una nueva cuenta"
        >
          Registrarse
        </button>
   
      </div>
    </div>
  </div>

  <!-- Overlay oscuro cuando el menú está abierto -->
  @if (isMenuOpen()) {
  <div 
    class="fixed inset-0 z-30 bg-black/50 md:hidden transition-opacity duration-300"
    (click)="toggleMenu()"
  ></div>
  }

  <!-- Menú Móvil Desplegable -->
  @if (isMenuOpen()) {
  <div class="fixed inset-0 z-35 md:hidden">
    <div 
      class="absolute top-20 left-0 right-0 bg-white shadow-2xl transform transition-transform duration-300 ease-out"
      [class]="isMenuOpen() ? 'translate-y-0' : '-translate-y-full'"
    >
      <div class="px-4 pt-6 pb-8 space-y-6 border-t border-gray-100">
        <!-- Links de Autenticación Móvil -->
        <div class="space-y-3">
          <button
            (click)="navigateToLogin(); closeMenu()"
            class="w-full text-left px-4 py-3 text-base font-medium text-gray-700 hover:bg-gray-50 hover:text-purple-700 rounded-lg transition-colors flex items-center gap-3"
          >
            <i class="fas fa-sign-in-alt text-gray-400"></i>
            <span>Iniciar Sesión</span>
          </button>
          
          <button
            (click)="navigateToRegister(); closeMenu()"
            class="w-full text-center px-4 py-3 text-base font-medium text-white bg-purple-700 hover:bg-purple-800 rounded-lg shadow transition-colors flex items-center justify-center gap-3"
          >
            <i class="fas fa-user-plus"></i>
            <span>Registrarse</span>
          </button>
        </div>
        
        <!-- Enlaces adicionales -->
        <div class="pt-4 border-t border-gray-200 space-y-3">
          <a (click)="closeMenu()" href="/" class="block px-4 py-2 text-gray-600 hover:text-purple-700 hover:bg-gray-50 rounded-lg transition-colors items-center">
            <i class="fas fa-home mr-3 w-5 text-center"></i>
            <span>Inicio</span>
          </a>
          <a (click)="closeMenu()" href="#" class="block px-4 py-2 text-gray-600 hover:text-purple-700 hover:bg-gray-50 rounded-lg transition-colors items-center">
            <i class="fas fa-tag mr-3 w-5 text-center"></i>
            <span>Categorías</span>
          </a>
          <a (click)="closeMenu()" href="#" class="block px-4 py-2 text-gray-600 hover:text-purple-700 hover:bg-gray-50 rounded-lg transition-colors items-center">
            <i class="fas fa-question-circle mr-3 w-5 text-center"></i>
            <span>Ayuda</span>
          </a>
          <a (click)="closeMenu()" href="#" class="block px-4 py-2 text-gray-600 hover:text-purple-700 hover:bg-gray-50 rounded-lg transition-colors items-center">
            <i class="fas fa-info-circle mr-3 w-5 text-center"></i>
            <span>Sobre Nosotros</span>
          </a>
        </div>
      </div>
    </div>
  </div>
  }
</nav>
