<nav
  class="fixed top-0 z-50 w-full bg-neutral-primary-soft border-b border-default"
>
  <div class="px-3 py-3 lg:px-5 lg:pl-3">
    <div class="flex items-center justify-between gap-4">
      <!-- Sección izquierda: Botón menú + Logo -->
      <div class="flex items-center gap-3 shrink-0">
        <!-- Botón hamburguesa con evento click -->
        <button
          (click)="toggleSidebar()"
          type="button"
          class="text-heading bg-transparent box-border border border-transparent hover:bg-neutral-secondary-medium focus:ring-4 focus:ring-neutral-tertiary font-medium leading-5 rounded-base text-sm p-2 focus:outline-none"
        >
          <span class="sr-only">Toggle sidebar</span>
          <svg
            class="w-6 h-6"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-width="2"
              d="M5 7h14M5 12h14M5 17h10"
            />
          </svg>
        </button>
        
        <!-- Logo: se oculta en pantallas medianas y pequeñas -->
        <figure class="hidden md:flex">
          <img
            src="./assets/img/logo-alquilaYa.svg"
            class="h-8"
            alt="Logo de alquilaYa"
          />
        </figure>
      </div>

      <!-- Buscador: con ancho controlado -->
      <div class="relative flex-1 max-w-md lg:max-w-xl">
        <input
          type="search"
          class="w-full py-3 pl-12 pr-4 text-gray-700 placeholder-gray-400 border-0 focus:ring-0 focus:ring-transparent bg-white rounded-2xl inset-shadow-xs shadow-lg text-sm md:text-base"
          placeholder="Buscar propiedades, servicios..."
        />
        <button
          type="submit"
          class="absolute left-0 top-0 mt-3 ml-4 text-gray-400 hover:text-purple-600"
        >
          <i class="fas fa-search text-marca text-base"></i>
        </button>
      </div>

      <!-- Sección derecha: Theme toggle + User -->
      <div class="flex items-center gap-2 shrink-0">
        <button
          id="theme-toggle"
          type="button"
          class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-2.5"
        >
          <svg
            id="theme-toggle-dark-icon"
            class="hidden w-5 h-5"
            fill="currentColor"
            viewBox="0 0 20 20"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
            ></path>
          </svg>
          <svg
            id="theme-toggle-light-icon"
            class="hidden w-5 h-5"
            fill="currentColor"
            viewBox="0 0 20 20"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
              fill-rule="evenodd"
              clip-rule="evenodd"
            ></path>
          </svg>
        </button>

        <div class="flex items-center">
          <button
            type="button"
            class="flex text-sm bg-gray-800 rounded-full focus:ring-4 focus:ring-gray-300 dark:focus:ring-gray-600"
            aria-expanded="false"
            data-dropdown-toggle="dropdown-user"
          >
            <span class="sr-only">Open user menu</span>
            <img
              class="w-8 h-8 rounded-full"
              src="https://flowbite.com/docs/images/people/profile-picture-5.jpg"
              alt="user photo"
            />
          </button>
          
          <div
            class="z-50 hidden bg-neutral-primary-medium border border-default-medium rounded-base shadow-lg w-44"
            id="dropdown-user"
          >
            <div class="px-4 py-3 border-b border-default-medium" role="none">
              <p class="text-sm font-medium text-heading" role="none">
                Miguel Dolic
              </p>
              <p class="text-sm text-body truncate" role="none">mdolicg</p>
            </div>
            <ul class="p-2 text-sm text-body font-medium" role="none">
              <li>
                <a
                  href="#"
                  class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded"
                  role="menuitem"
                >
                  <lucide-icon [img]="User" [size]="18"></lucide-icon>
                  <span class="flex-1 ms-3 whitespace-nowrap">Perfil</span>
                </a>
              </li>
              <li class="border-b border-default-medium">
                <a
                  href="#"
                  class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded"
                  role="menuitem"
                >
                  <lucide-icon [img]="Cog" [size]="18"></lucide-icon>
                  <span class="flex-1 ms-3 whitespace-nowrap"
                    >Configuración</span
                  >
                </a>
              </li>
              <li>
                <a
                  href="#"
                  class="flex items-center text-red-600 w-full p-2 hover:bg-neutral-tertiary-medium hover:text-red-600 rounded group"
                  role="menuitem"
                >
                  <lucide-icon [img]="DoorOpen" [size]="18"></lucide-icon>
                  <span class="flex-1 ms-3 whitespace-nowrap"
                    >Cerrar Sesión</span
                  >
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
